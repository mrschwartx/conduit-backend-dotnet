services:
  conduit-mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: conduit-mssql
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-Conduit_Local_Passw0rd}
    ports:
      - "127.0.0.1:1433:1433"
    volumes:
      - conduit-mssql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q \"SELECT 1\" -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  conduit-backend:

volumes:
  conduit-mssql-data: